name: Publish

# Publishes a tagged version through npm trusted publishing (OIDC). No token is
# stored in this repository, in Actions secrets, or on anyone's machine.
#
# Requires a trusted publisher configured once on npmjs.com for this package:
# GitHub Actions, repository mpinaev/dsh-context-governor, workflow file
# publish.yml, with the "Allow npm publish" permission.
#
# npm generates provenance attestations automatically for trusted publishing —
# do not add --provenance here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No registry-url on purpose. With it, setup-node writes an npmrc
      # _authToken sentinel and npm authenticates with that token instead of the
      # OIDC identity — trusted publishing then fails with a 404 even when the
      # trusted publisher is configured on npmjs.com. Without it npm talks to the
      # public registry by default and exchanges the OIDC token itself.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      # The tag names the release; a mismatch would publish one version under
      # another version's name, which is not recoverable.
      - name: The tag must match the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
      - name: Smoke test
        run: npm test
      # Diagnose the OIDC hand-off without printing any token: trusted publishing
      # needs GitHub to expose the id-token request endpoint to this step.
      - name: OIDC diagnostics
        run: |
          echo "request url: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "request token: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "npm: $(npm --version) on node $(node --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
            echo "oidc token request: HTTP $code"
          fi
      - name: Publish to npm
        run: npm publish
